<script>
// ===== データ(数値はすべて仮) =====
const REGIONS = {
  北海道: ["北海道"], 東北: ["宮城","青森","岩手","秋田","山形","福島"],
  関東: ["東京","神奈川","埼玉","千葉","茨城","栃木","群馬"], 中部: ["愛知","長野","静岡","新潟","石川"],
  関西: ["大阪","兵庫","京都","滋賀","奈良","和歌山"], "中国・四国": ["広島","岡山","香川","愛媛"], 九州: ["福岡","熊本","鹿児島","沖縄"],
};
const GENRES = { "メロコア":1, "ハードロック":.9, "スカパンク":.9, "パンク":.9, "メタル":.8, "J-POP":1.2, "ソロ":1 };
const TYPES = { early: { label: "早熟型", peak: 2, spread: 2 }, normal: { label: "標準型", peak: 5, spread: 3 }, late: { label: "晩成型", peak: 9, spread: 4 } };
const STATS = ["演奏力", "作曲力", "ライブ力", "個性"];
const STAT_FX = { "演奏力": "ツアー中の人気が上がりやすい", "作曲力": "盤がバズりやすい", "ライブ力": "集客(動員・ライブ収入)が増えやすい", "個性": "MVの視聴回数が増えやすい" };
// w: 各工程の週数 [立ち上がり, 作曲, 収録, 編曲, プレス] / lc:レーベル費用 bc:バンド費用(万)
const FMT = {
  single: { label: "シングル", lc: 0, bc: 10, price: 1000, boost: 1, w: [1, 2, 1, 1, 1] },
  mini: { label: "ミニアルバム", lc: 8, bc: 25, price: 2000, boost: 1.5, w: [1, 4, 2, 2, 1] },
  album: { label: "アルバム", lc: 15, bc: 50, price: 3000, boost: 2, w: [1, 6, 3, 3, 2] },
};
const STAGES = [["立ち上がり", 1], ["作曲", 1], ["収録", 1], ["編曲(外注)", 0], ["プレス", 0]];   // 2つ目: バンドの行動を占有するか
// バンドの性格(友好度2で判明。契約時の条件に関わる)
const TRAITS = { "素直": "特に条件なし", "野心家": "知名度15以上のレーベルでないと契約しない(友好度が最大なら知名度10以上で契約してくれる)", "職人気質": "レーベルの取り分は4割まで", "義理堅い": "観に行くと友好度が2上がる", "現実派": "契約金が50万(友好度が最大なら40万に下げてくれる)" };
const COST = { watchHome: 2, watchAway: 15, sign: 30, promo: 3, aid: 10, reissue: 5, relLive: 30 };
const OVERHEAD = 1;   // レーベルの固定費(事務所・ネット回線・保険など)。毎週(万円)。数値は仮
const GAME_VERSION = "0.9.0";   // 公開前のバージョン
// クレジットに載せる制作者の情報。空欄のままの項目は表示されません(公開前にここを書き換える)
const CREDITS = { producer: "", contact: "", site: "" };

const freshState = () => ({ screen: "title", tab: "live", label: "", fav: null, respawn: [], week: 1, money: 200, loans: [], fame: 0, bands: [], home: null, view: null, pref: null, pools: {}, lastVisit: -9, used: false, logs: [], slot: null, alumni: [], nextId: 1, ltSel: [], ltName: "", hist: {}, llw: -1, intro: false, goal: null, stat: {}, review: null, over: null });
const state = freshState();
function resetState(keep) { const f = freshState(); Object.keys(state).forEach(k => delete state[k]); Object.assign(state, f, keep); }
const rand = (a, b) => Math.random() * (b - a) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const inHome = p => REGIONS[state.home].includes(p);
// バンド名: 英語名・漢字名・カタカナ名・ソロ名のパターンから生成
const EN1 = ["Midnight","Paper","Velvet","Static","Hollow","Lunar","Electric","Pale","Silent","Burning","Cheap","Wild","Neon","Rusty"];
const EN2 = ["Parade","Hearts","Riot","Echoes","Kids","Circuit","Animals","Letters","Engine","Tides","Cassette","Orchestra","Sparks","Wolves"];
const JA = ["夜行","白昼","透明","深海","砂漠","終電","夕立","午前三時","青春","雨上がり","月曜","回転"];
const JB = ["少年","楽団","クラブ","ロマンス","フィルム","サーカス","ラジオ","同盟","ハイウェイ","旅団"];
const KA = ["ミルク","レモン","ポスト","ネオン","ブルー","ガラス","ランドリー"];
const KB = ["ジャム","ガーデン","スープ","ロケット","ノイズ","ダンス","シガレッツ"];
const SOLO = ["ミナト","soraneko","Haru","夕凪リオ","aoi.","ナギサ","Rin","月詠ユイ","kanata","ヒナタ","Sora Hirano","ミオ","ren","Yuki Mori","凪","ルカ"];
function bandName(members) {
  if (members === 1) return pick(SOLO);
  const r = Math.random();
  if (r < 0.35) return pick(EN1) + " " + pick(EN2);
  if (r < 0.5) return "The " + pick(EN1) + " " + pick(EN2);
  if (r < 0.8) return pick(JA) + pick(JB);
  return pick(KA) + pick(KB);
}
const SA = ["夏の","夜の","最後の","透明な","ひとりの","雨の"], SB = ["終電","帰り道","ランドリー","ネオン","手紙","約束","朝焼け","ノイズ"];
const songName = () => pick(SA) + pick(SB);
const power = b => STATS.reduce((t, s) => t + b.ab[s], 0) / STATS.length;
const num = n => Math.round(n);
// ===== セーブ(このブラウザのlocalStorageに2スロット。描画のたびに自動保存) =====
const SAVE_KEY = n => "indie-label-save-" + n;
// セーブデータの形式のバージョン。ゲームの仕組みを変えてセーブの形が変わるときに上げて、MIGRATIONSに変換処理を足す
const SAVE_VERSION = 2;
const MIGRATIONS = {
  // v1 → v2: MV・歴代バンド・サブスク・動員数などの導入前のデータ。足りない項目は、読み込み時の補完(ensureBand と初期値)で埋める
  1: s => { s.alumni = s.alumni || []; s.hist = s.hist || {}; s.ltSel = s.ltSel || []; },
};
let saveWarned = false;
function save() {
  if (!state.slot) return;
  try { localStorage.setItem(SAVE_KEY(state.slot), JSON.stringify({ v: SAVE_VERSION, gv: GAME_VERSION, savedAt: Date.now(), state })); }
  catch (e) { if (!saveWarned) { saveWarned = true; log("⚠ この環境ではセーブできませんでした"); } }
}
function rawSlot(n) { try { return localStorage.getItem(SAVE_KEY(n)); } catch (e) { return null; } }
// 読み込み結果: null=空き / {bad:"broken"|"newer"}=読み込めない / それ以外=セーブデータ
function readSlot(n) {
  const raw = rawSlot(n);
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    if (!d || typeof d !== "object" || !d.state || typeof d.state !== "object" || !Array.isArray(d.state.bands) || !Number.isFinite(d.state.week)) return { bad: "broken" };
    if ((d.v || 1) > SAVE_VERSION) return { bad: "newer", gv: d.gv };
    return d;
  } catch (e) { return { bad: "broken" }; }
}
function migrate(d) {
  let v = d.v || 1;
  while (v < SAVE_VERSION) { if (MIGRATIONS[v]) MIGRATIONS[v](d.state); v++; }
  d.v = SAVE_VERSION;
  return d;
}
// 読み込んだ状態の最低限の点検(数値が壊れていたら0に戻す)
function repairState(s) {
  ["money", "fame", "week"].forEach(k => { if (!Number.isFinite(s[k])) s[k] = k === "week" ? 1 : 0; });
  if (!Array.isArray(s.loans)) s.loans = [];
  if (!s.pools || typeof s.pools !== "object") s.pools = {};
}
let slotMsg = "", delAsk = 0, slotAsk = 0;   // セーブ選択画面の一時的な表示(セーブしない)
function loadSlot(n) {
  const d = readSlot(n);
  if (!d || d.bad) { slotMsg = d && d.bad === "newer" ? "このデータは新しいバージョンのゲームで作られているため、読み込めません。" : "このデータは読み込めません。"; render(); return; }
  const oldV = d.v || 1;
  if (oldV < SAVE_VERSION) {   // 古い形式は、変換する前の元データを控えに残してから変換する
    try { localStorage.setItem(SAVE_KEY(n) + "-before-v" + SAVE_VERSION, rawSlot(n)); } catch (e) {}
    migrate(d);
  }
  resetState(d.state);
  repairState(state); ensureGoal();
  state.bands.forEach(ensureBand); Object.values(state.pools).forEach(a => a.forEach(ensureBand));
  state.screen = state.over ? "over" : "game"; state.slot = n; slotMsg = ""; delAsk = 0; slotAsk = 0;
  document.getElementById("log").innerHTML = (state.logs || []).map(l => `<p>${esc(l)}</p>`).join("");
  render();   // 描画のときに、いまの形式で保存し直される
}
function deleteSlot(n) {
  try { localStorage.removeItem(SAVE_KEY(n)); for (let v = 2; v <= SAVE_VERSION + 5; v++) localStorage.removeItem(SAVE_KEY(n) + "-before-v" + v); } catch (e) {}
  if (state.slot === n) state.slot = null;
}
function slotInfo(d) {
  const s = d.state, y = Math.floor((s.week - 1) / 52) + 1, w = (s.week - 1) % 52 + 1;
  return esc((s.label || "").trim() || "名もなきレーベル") + " / " + dateOf(s.week) + " / 資金" + Math.round(s.money) + "万 / 所属" + s.bands.length + "組" + (s.over ? " / 💀ゲームオーバー" : "") + " / 保存 " + new Date(d.savedAt).toLocaleString("ja-JP");
}
const GC = { "メロコア": "#3b82f6", "ハードロック": "#f59e0b", "スカパンク": "#10b981", "パンク": "#ef4444", "メタル": "#8b5cf6", "J-POP": "#ec4899", "ソロ": "#14b8a6" };

function log(t) { document.getElementById("log").insertAdjacentHTML("afterbegin", `<p>${esc(t)}</p>`); state.logs = [t, ...(state.logs || [])].slice(0, 30); }

function createBand(home) {

  const b = { name: bandName(members), members, home, genre: members === 1 ? "ソロ" : (state.fav && state.fav !== "ソロ" && Math.random() < 0.4 ? state.fav : pick(Object.keys(GENRES).filter(g => g !== "ソロ"))),
    years, type: pick(Object.keys(TYPES)), rate: rand(0.8, 1.2), ab, pot, pop: rand(5, 25), fund: 0, share: 0.4,

const getPool = p => state.pools[p] || (state.pools[p] = [createBand(p), createBand(p), createBand(p)]);

// ===== レーベル(社長)の行動: 1週に1つ =====
function useAction() { if (state.used) { log("今週のあなたの行動はもう使いました"); return false; } return true; }

function start(r) { state.screen = "game"; state.home = r; state.view = r; state.pref = REGIONS[r][0]; state.stat = {}; state.goal = newGoals(1); log((state.label.trim() || "名もなきレーベル") + "を" + r + "に設立"); if (state.fb) { firstBand(state.pref); state.fb = null; state.screen = "intro"; state.introPage = 0; } log("🎯 最初の目標: 5年以内に、3つのうち2つを達成しよう(「🎯 目標」タブ)"); render(); }

// 契約金: 基本30万。現実派は50万(友好度が最大なら40万)。入社希望は3割引
function signFee(b) {

}
// 野心家が契約に求めるレーベルの知名度: 通常15、友好度が最大なら10

// 画面に出す契約金: 性格がまだ分からないうちは基本額(性格が分かると正確な額)

function sign(p, i, share) {

  // 野心家: 知名度15未満のレーベルとは契約しない。ただし友好度が最大(5)なら、知名度10以上で契約してくれる
  if (b.trait === "野心家" && state.fame < ambitionNeed(b)) { b.known = true; return log(b.name + "は野心家: 知名度" + ambitionNeed(b) + "以上のレーベルでないと契約しないと言われた" + (b.fr < 5 ? "(友好度が最大なら、知名度10以上で契約してくれそう)" : "")); }

// 興味のないバンドをリストから消す(行動は消費しない)。ツアー・入社希望以外は、4週間後に新しいバンドが補充される

// ===== 借入(行動は消費しない。数値は仮) =====
// fame: 審査に必要なレーベルの知名度 / rate: 年利 / term: 返済期間(週)。毎週、元金の均等返済+残高への利息を払う
const LENDERS = [
  { name: "地元の信用金庫", limit: 100, rate: 0.03, term: 104, fame: 5, text: "金利が低く返済期間も長いが、借りられる額が小さく、審査(知名度5以上)がある" },

];
const debtOf = name => state.loans.filter(l => l.lender === name).reduce((t, l) => t + l.rem, 0);
function borrow(k, amt) {
  const L = LENDERS[k];

// ===== バンドとの約束(要望)と契約更新 =====
const RANK = { single: 1, mini: 2, album: 3 };
function newPromise(b) {   // バンドからの要望。期限は1年(52週)
  const r = Math.random(), now = state.week;
  let p;
  if (r < 0.5) { const fmt = pick(["single", "mini", "mini", "album"]); p = { kind: "release", fmt, text: FMT[fmt].label + "をリリースする" }; }
  else if (r < 0.75) p = { kind: "tour", text: "ツアーに出る" };
  else { const amount = pick([20, 30, 40]); p = { kind: "aid", amount, got: 0, text: "資金援助を合計" + amount + "万円以上する" }; }
  return Object.assign(p, { from: now, due: now + 52, status: "継続中" });
}
function promiseDone(b, kind, arg) {   // 約束を果たしたら信頼度+10
  b.promises.forEach(p => {
    if (p.status !== "継続中" || p.kind !== kind) return;
    if (kind === "release" && RANK[arg] < RANK[p.fmt]) return;
    if (kind === "aid") { p.got += arg; if (p.got < p.amount) return; }
    p.status = "達成"; b.trust = Math.min(100, b.trust + 10);
    log("✅ " + b.name + "との約束を果たした: " + p.text + "(信頼度+10)");
  });
}
function makeRenewal(b) {   // 更新時、人気があるバンドほど取り分(レーベル側)を下げてほしいと打診してくる
  const want = (b.pop >= 40 && Math.random() < 0.6) || Math.random() < 0.25;
  const propose = want && b.share > 0.2 ? Math.round((b.share - 0.1) * 10) / 10 : null;

}
function renewAnswer(i, v) {

  if (b.trust < 30) { retire(b, "信頼度が低く更新を断られた"); state.bands.splice(i, 1); log(b.name + "は信頼度が低く、更新を断ってレーベルを去った…"); return render(); }

  else if (r.propose !== null) { b.trust = Math.max(0, b.trust - 5); log(b.name + "の打診を断って更新(信頼度-5)"); }

// ===== 週の進行 =====
// ライブの収入は人気ではなく動員数で決まる(動員100人 = 人気25相当)。400人(人気100相当)を超えた分は伸びが緩やかになる

function monthOf(w) { const i = wkOf(w) - 1, m = Math.floor(i * 12 / 52) + 1; return [m, i - Math.ceil((m - 1) * 52 / 12) + 1]; }

    } else if (!isLoad && slotAsk === n) {

document.addEventListener("click", e => {

  if (!el) return;
  const a = el.dataset.act, i = +el.dataset.i, p = el.dataset.p;
  if (a === "new") { state.screen = "slot"; slotMsg = ""; delAsk = 0; slotAsk = 0; render(); }
  else if (a === "cont") { state.screen = "load"; slotMsg = ""; delAsk = 0; slotAsk = 0; render(); }
  else if (a === "delask") { delAsk = +el.dataset.n; slotAsk = 0; slotMsg = ""; render(); }
  else if (a === "delno") { delAsk = 0; render(); }
  else if (a === "delgo") { const n = +el.dataset.n; deleteSlot(n); delAsk = 0; slotMsg = "スロット" + n + "のデータを削除しました。"; render(); }
  else if (a === "slotask") { slotAsk = +el.dataset.n; delAsk = 0; slotMsg = ""; render(); }

  else if (a === "loadslot") loadSlot(+el.dataset.n);

  else if (a === "tab") { state.tab = el.dataset.v; render(); }

  else if (a === "goalnow") { state.tab = "goal"; render(); toTop(); }

  else if (a === "start") start(el.dataset.v);
  else if (a === "areago") { state.fbRegion = el.dataset.v; fbInit(); state.screen = "firstband"; render(); }
  else if (a === "fbdice") { state.fb.name = bandName(state.fb.members); render(); }
  else if (a === "fbmem") { const n = +el.dataset.v; if (state.fb.members === 1 || n === 1) state.fb.name = bandName(n); state.fb.members = n; render(); }
  else if (a === "fbgenre") { state.fb.genre = el.dataset.v; render(); }
  else if (a === "fbback") { state.screen = "area"; render(); }
  else if (a === "fbgo") start(state.fbRegion);
  else if (a === "next") tryNext();
  else if (a === "nextgo") { warnOpen = false; nextWeek(); }
  else if (a === "warnback") { warnOpen = false; state.tab = "bands"; render(); }
  else if (a === "totitle") { backAsk = true; render(); }
  else if (a === "howto") openInfo("howto");
  else if (a === "credits") openInfo("credits");
  else if (a === "closeinfo") { state.screen = infoFrom; render(); toTop(); }
  else if (a === "titleno") { backAsk = false; render(); }
  else if (a === "titlego") { save(); backAsk = false; warnOpen = false; state.screen = "title"; render(); }
  else if (a === "pref") { state.pref = el.dataset.v; render(); }
  else if (a === "watch") watch(p, i);
  else if (a === "sign") sign(p, i, +el.closest(".card").querySelector("[data-share]").value);
  else if (a === "promo") promo();
  else if (a === "aid") aid(i);
  else if (a === "stop") { state.bands[i].discs[+el.dataset.d].status = "廃盤"; render(); }
  else if (a === "reissue") {
    const d = state.bands[i].discs[+el.dataset.d];
    if (state.money < COST.reissue) return log("再販費用が足りません");
    state.money -= COST.reissue; d.status = "発売中"; d.age = 4; d.premium = false; log("『" + d.title + "』を再販"); render();
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.sel === "region") { state.view = t.value; state.pref = REGIONS[t.value][0]; render(); }
  else if (t.dataset.plan !== undefined) { state.bands[+t.dataset.plan].plan = t.value; render(); }
  else if (t.dataset.subpick !== undefined) { state.bands[+t.dataset.subpick].subPick = t.value === "1"; save(); }
  else if (t.dataset.mvdisc !== undefined) { state.bands[+t.dataset.mvdisc].mvDisc = +t.value; save(); }
});
document.addEventListener("input", e => {
  const f = e.target.dataset.f;
  if (!f) return;
  if (f === "label") { state.label = e.target.value; return; }
  if (f === "ltName") { state.ltName = e.target.value; save(); return; }
  if (f === "signName") { const pb = getPool(e.target.dataset.p)[+e.target.dataset.i]; if (pb) pb.signName = e.target.value; return; }
  if (f === "fbname") { state.fb.name = e.target.value; return; }
  const b = state.bands[+e.target.dataset.i];
  if (f === "name") b.name = e.target.value; else if (f === "title") b.title = e.target.value; else if (f === "tourName") b.tourName = e.target.value; else if (f === "mvTitle") b.mvTitle = e.target.value;
  save();
});
render();
</script>
</body>
</html>
